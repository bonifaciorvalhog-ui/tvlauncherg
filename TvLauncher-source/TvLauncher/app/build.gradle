plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Chave do TMDB lida de local.properties (TMDB_API_KEY=...). Não vai para o controle de versão.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.example.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.tvlauncher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        buildConfigField 'String', 'TMDB_API_KEY', "\"${localProps.getProperty('TMDB_API_KEY', '')}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
