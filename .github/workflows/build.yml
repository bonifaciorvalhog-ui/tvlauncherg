name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Achar o projeto
        run: echo "PROJECT_DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")" >> $GITHUB_ENV
      - name: Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" >> "$PROJECT_DIR/local.properties"
      - name: Compilar
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
